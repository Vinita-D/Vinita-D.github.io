- title: Experience
  type: time_table
  contents:
    - title: Postdoctoral researcher, heat and moisture transport in weather extremes
      institution: Department of Meteorology and Geophysics, University of Vienna, Austria
      year: 2025 – 2026
      description:
        - Developed a Lagrangian moist static energy framework that attributes heatwave intensity to surface fluxes and transported air masses.
        - Validated the framework on Storm Boris.
        - Part of the Horizon Europe project Edu4ClimAte; manuscript submitted to Weather and Climate Dynamics.
    - title: PhD researcher, dynamics of atmospheric blocking and its link with warm extremes
      institution: Laboratoire de Météorologie Dynamique (LMD), CNRS / ENS-PSL, Paris, France
      year: 2021 – 2024
      description:
        - Ran and analysed long-term simulations of a dry general circulation model forced towards the ERA5 climatology.
        - Evaluated model blocking against ERA5 and attributed systematic biases, using Eulerian and Lagrangian methods.
        - Supervised by Gwendal Rivière (LMD-ENS) and Sébastien Fromang (LSCE).
    - title: Research stay, blocking characteristics and heatwaves
      institution: Uppsala University, Sweden (EDIPI exchange)
      year: 2024
      description:
        - Developed a quasi-Lagrangian heatwave detection and quantified the statistical link between blocking and heatwave characteristics, with Gabriele Messori.
    - title: Research stay, Gulf Stream latent heat fluxes and Euro-Atlantic blocking
      institution: Imperial College London, United Kingdom (EDIPI exchange)
      year: 2023
      description:
        - Analysed ECMWF-IFS experiments with suppressed latent heat fluxes for the 2010 British Isles cold spell and the 2019 European heatwave, with Arnaud Czaja and Jamie Mathews.
    - title: Master's thesis, low-pressure systems in the monsoon trough
      institution: Indian Institute of Tropical Meteorology (IITM), Pune, India
      year: 2020
      description:
        - Convective characteristics of monsoon low-pressure systems from TRMM satellite radar observations.

